name: Validate and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR replaces an older build; branches and PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate decks and report missing translations
        run: npm run validate
      - name: Unit tests with coverage
        run: npm run test:coverage
      - run: npm run build
      - name: Install Playwright browser
        run: npm run test:e2e:browser
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Lighthouse
        run: npm run lighthouse
      - name: Write README badges into the site
        run: npm run badges
      - name: Keep test and Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: |
            reports/
            coverage/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # Deploys run one after another and are never cancelled halfway.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
